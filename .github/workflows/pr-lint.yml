name: PR lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pull-request title becomes the squash-merge commit message, so it has to
  # satisfy exactly the rules commitlint.config.mjs enforces on commits.
  title:
    name: title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # v6 reports its verdict as a commit status rather than only as a job
      # result, so the token needs to be able to write one. Without this the
      # title is validated correctly and the action then dies posting the
      # answer, which fails the job whatever the title says.
      statuses: write

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          scopes: |
            app
            views
            widgets
            features
            entities
            shared
            i18n
            seo
            a11y
            ui
            config
            deps
            ci
            docker
            docs
            test
            e2e
            release
            security
          # commitlint sets `scope-empty` to warn, not error: a change that
          # genuinely spans every layer may omit the scope.
          requireScope: false
          # Mirrors commitlint's `subject-case` (no Start-Case/PascalCase/UPPER)
          # and `subject-full-stop`.
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" of pull request title "{title}" is invalid.
            It must start with a lower-case letter and must not end with a period.
          # A work-in-progress title is the author's own signal; blocking it adds
          # noise without adding safety, because the merge is blocked anyway.
          wip: true
          validateSingleCommit: false

  # The squash commit takes its title and body from this pull request, and
  # GitHub reads that whole message looking for a marker that means "run no
  # workflows" — anywhere in it, quoted or not, prose or intent.
  #
  # A merge carrying one silently skips every workflow on the target branch. On
  # `main` that means no release, so no deployment, and a green merge that
  # changed nothing. It has happened twice on this repository: once from a
  # commit semantic-release wrote, and once from a description explaining the
  # first. The second is why this check exists rather than a note asking people
  # to be careful.
  skip-marker:
    name: no CI-skip marker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject a CI-skip marker in the title or description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Every spelling GitHub honours, built rather than written out, so
          # that this file does not itself carry one into its own merge commit.
          o='['
          c=']'
          pattern="\\${o}(skip[ -]ci|ci[ -]skip|no[ -]ci|skip[ -]actions|actions[ -]skip)\\${c}"
          found=0
          for field in TITLE BODY; do
            value="${!field:-}"
            if printf '%s' "$value" | grep -Eiq "$pattern"; then
              echo "::error::The pull request $(printf '%s' "$field" | tr '[:upper:]' '[:lower:]') contains a CI-skip marker."
              printf '%s\n' "$value" | grep -Ein "$pattern" || true
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "Squash-merging copies this text into the commit message, and GitHub would then run"
            echo "no workflows on the target branch: no release, no deployment, and nothing to say so."
            echo "Rephrase it — naming the marker without writing it is enough."
            exit 1
          fi
          echo "No CI-skip marker in the title or description."

  # Branch names feed the release channel and the deploy triggers, so a typo
  # here is a deployment bug, not a style issue.
  branch:
    name: branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate the branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Kept byte-for-byte in step with the validate-branch-name pattern in
          # package.json, which enforces the same rule locally on push.
          pattern='^(main|develop)$|^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix|release)/[a-z0-9._-]+$'
          echo "Branch: $BRANCH"
          if ! printf '%s' "$BRANCH" | grep -Eq "$pattern"; then
            echo "::error::Branch name '$BRANCH' does not match $pattern"
            echo "Use <type>/<kebab-case>, for example: feat/contact-form or fix/locale-switcher-focus"
            exit 1
          fi
          echo "Branch name is valid."

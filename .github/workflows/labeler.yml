name: Labeler

# pull_request_target is required so that pull requests opened from forks get a
# token that can actually write labels. It is safe here only because this
# workflow never checks out or executes pull-request code — it reads the changed
# file list from the API and nothing else. Do not add a checkout step.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          # Labels a maintainer removed by hand stay removed; the bot classifies,
          # it does not overrule.
          sync-labels: false

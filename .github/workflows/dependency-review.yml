name: Dependency review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub's own dependency review reads the dependency graph, which needs
  # Advanced Security on a private repository. It skips rather than fails there;
  # the `audit` job below is the check that runs either way.
  review:
    name: review
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to post the summary comment on the pull request.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # Anything at high or above blocks the merge; moderate and below are
          # reported so they can be triaged rather than silently absorbed.
          fail-on-severity: high
          # A network-copyleft licence would place obligations on a hosted site
          # that this project does not intend to take on.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
          warn-only: false

  # Works on any repository, public or private: pnpm resolves advisories from
  # the registry rather than from GitHub's dependency graph.
  #
  # Deliberately NOT part of the `ci-ok` gate. A new advisory can land against a
  # transitive dependency overnight and turn this red on a pull request that did
  # not touch it — that is worth an alert, not a merge block.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit the dependency tree
        run: pnpm audit --audit-level=high

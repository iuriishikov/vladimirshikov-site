name: Release

on:
  push:
    branches:
      # main publishes stable versions; develop publishes the `rc` prerelease
      # channel. Both are configured in .releaserc.json.
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release: an interrupted semantic-release run can leave a tag
  # published without its GitHub release, or a changelog commit without a tag.
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Push the changelog commit and create the git tag.
      contents: write
      # Comment on the issues and pull requests included in the release.
      issues: write
      pull-requests: write
      # Provenance for anything semantic-release publishes.
      id-token: write

    steps:
      # semantic-release derives the next version from the full commit history
      # since the last tag, so a shallow clone would compute the wrong version.
      # persist-credentials: false keeps the checkout token out of .git/config —
      # semantic-release authenticates through GITHUB_TOKEN instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Locate the pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `chore(release)` commit that @semantic-release/git pushes carries
      # `[skip ci]`, which stops this workflow from triggering itself.
      #
      # Note: a tag or release created with GITHUB_TOKEN does not start another
      # workflow run. Deploy.yml therefore fires on the *release published*
      # event only when a human (or an app token) publishes it, and a routine
      # semantic-release run publishes a version that nothing has deployed.
      #
      # Reaching production is a deliberate act: dispatch deploy.yml against the
      # published tag. It cannot be a re-run, as this note once said — no run
      # ever existed for that tag to re-run.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Attribute the changelog commit to the Actions bot rather than to
          # whoever happened to merge the pull request.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm release

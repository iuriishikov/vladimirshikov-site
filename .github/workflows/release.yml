name: Release

on:
  push:
    branches:
      # `main` is the only release branch, and the only branch this needs to
      # run on. `develop` used to publish an `rc` prerelease channel, which
      # produced versions nothing deployed, a changelog commit that conflicted
      # with main's on every promotion, and — because semantic-release marks
      # its own commits `[skip ci]` — a develop tip that silently cancelled the
      # checks on every pull request opened from it.
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release: an interrupted semantic-release run can leave a tag
  # published without its GitHub release, or a changelog commit without a tag.
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Push the changelog commit and create the git tag.
      contents: write
      # Comment on the issues and pull requests included in the release.
      issues: write
      pull-requests: write
      # Provenance for anything semantic-release publishes.
      id-token: write
      # Dispatch the deployment of what was just published.
      actions: write

    outputs:
      version: ${{ steps.published.outputs.version }}

    steps:
      # semantic-release derives the next version from the full commit history
      # since the last tag, so a shallow clone would compute the wrong version.
      # persist-credentials: false keeps the checkout token out of .git/config —
      # semantic-release authenticates through GITHUB_TOKEN instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Locate the pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Read before, compared after: semantic-release does not report what it
      # published in a form a later step can read, and `releases/latest` is the
      # one fact that changes only when a release actually happens. A run that
      # analyses the commits and decides no release is due is normal, and must
      # not deploy anything.
      - name: Note the current release
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "Latest release before this run: ${tag:-none}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # The `chore(release)` commit that @semantic-release/git pushes carries
      # `[skip ci]`, which stops this workflow from triggering itself.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Attribute the changelog commit to the Actions bot rather than to
          # whoever happened to merge the pull request.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm release

      - name: Determine what was published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.before.outputs.tag }}
        run: |
          set -euo pipefail
          after="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -n "$after" ] && [ "$after" != "$BEFORE" ]; then
            echo "Published ${after}."
            echo "version=${after}" >> "$GITHUB_OUTPUT"
          else
            echo "No new release was published; there is nothing to deploy."
          fi

      # The link that was missing, and the reason a version could be published
      # while nothing reached the server. semantic-release creates the tag and
      # the release with GITHUB_TOKEN, and GitHub raises no workflow run from an
      # event that token caused — so `tags: ["v*"]` and `release: published` in
      # deploy.yml are both dead for a routine release, however correct they
      # look. `workflow_dispatch` is the documented exception, and dispatching
      # against the tag means the rollout builds precisely what was released.
      - name: Deploy what was published
        if: ${{ steps.published.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION"

          # A dispatch that starts nothing is exactly the silence this chain
          # exists to remove, and it looks identical to success from here. So
          # the run is waited for rather than assumed: a release that cannot
          # deploy itself should fail loudly, on the release, not be discovered
          # by someone wondering why the site never changed.
          for _ in $(seq 1 12); do
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
              --branch "$VERSION" --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
            if [ -n "$id" ]; then
              echo "Deploying ${VERSION}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${id}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Dispatched deploy.yml for ${VERSION} but no run appeared within a minute. ${VERSION} is published and undeployed."
          exit 1

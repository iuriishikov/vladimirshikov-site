# pnpm >= 10 reads shared project settings from this file.
# Docs: https://pnpm.io/settings

# ---------------------------------------------------------------------------
# Supply-chain hardening
# ---------------------------------------------------------------------------
# Postinstall scripts are blocked by default. A package may only run them when
# it is listed here — added consciously, with a reason.
allowBuilds:
  "@parcel/watcher": true # native file watching for vite/storybook dev servers
  "@swc/core": true # SWC binary used by Storybook's Next.js builder
  esbuild: true # vite/vitest dependency, needs its platform binary
  unrs-resolver: true # native resolver behind eslint-plugin-import-x
  msw: false # only its Node interceptor is used; no browser worker in ./public

# A package version must have been on the registry for at least this many
# minutes before it can be installed. This is the single cheapest defence
# against a compromised release being pulled in minutes after publication.
minimumReleaseAge: 1440 # 24 hours

# Versions deliberately allowed through the quarantine above (pinned by us).
minimumReleaseAgeExclude:
  - "@tanstack/eslint-plugin-query@5.102.2"
  - "@tanstack/query-core@5.102.2"
  - "@tanstack/query-devtools@5.102.2"
  - "@tanstack/react-query-devtools@5.102.2"
  - "@tanstack/react-query@5.102.2"
  - "@types/react-dom@19.2.5"

# ---------------------------------------------------------------------------
# Accepted advisories
# ---------------------------------------------------------------------------
# `pnpm audit` fails CI on anything high or above. These two are accepted
# deliberately, and each entry must say what it is, why it is tolerable, and
# what ends the exception. An empty list is the goal.
auditConfig:
  ignoreGhsas:
    # image-size <= 2.0.2 — infinite loops in the ICNS, JXL and HEIF parsers.
    #
    # No fix exists yet: the advisory names 2.0.3 as patched, but 2.0.2 is the
    # latest published version. It arrives only through
    # @storybook/nextjs-vite -> vite-plugin-storybook-nextjs, so it runs while
    # building Storybook, never in the deployed app, and it parses only images
    # committed to this repository. Renovate will offer the bump the day 2.0.3
    # ships; delete these two lines then.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

# ---------------------------------------------------------------------------
# Resolution
# ---------------------------------------------------------------------------
# Strict, non-hoisted node_modules: a module may only import what it declares.
nodeLinker: isolated
shamefullyHoist: false
autoInstallPeers: true
# A genuine peer conflict warns rather than blocking a developer's install; CI
# surfaces the same warnings in its log.
strictPeerDependencies: false
savePrefix: ^
preferFrozenLockfile: true

# ---------------------------------------------------------------------------
# Developer ergonomics
# ---------------------------------------------------------------------------
# Warn when node_modules is stale relative to the lockfile before running a
# script — catches the classic "works on my machine after a rebase" bug.
verifyDepsBeforeRun: warn
